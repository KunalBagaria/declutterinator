[package]
name = "declutterinator"
version = "0.1.1"
edition = "2024"
description = "BEHOLD! A macOS disk analyzer & cleaner that reclaims every wasted gigabyte in the Tri-State Area."
license = "MIT"
readme = "README.md"
authors = ["Kunal Bagaria"]
homepage = "https://declutter.kunalbagaria.com"
repository = "https://github.com/KunalBagaria/declutterinator"
keywords = ["macos", "disk", "cleaner", "cli", "storage"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.87"

[[bin]]
name = "declutterinator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
console = "0.16"
ctrlc = "3"
dialoguer = { version = "0.12", default-features = false }
indicatif = "0.18"
libc = "0.2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
